<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Muktinath Collection Stores</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container" style="margin-top:1rem;">
    <section class="category-section" style="max-width:480px; margin: auto;">
      <h3>Admin Login</h3>
      <div class="admin-form">
        <div class="form-row"><label>Username <input id="username" /></label></div>
        <div class="form-row"><label>Password <input id="password" type="password" /></label></div>
        <button id="loginBtn" class="btn">Login</button>
        <div id="loginMessage" class="admin-message"></div>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
