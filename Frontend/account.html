<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Account - Muktinath Collection Stores</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="siteHeader" data-subtitle="My account"></div>
  <main class="container" style="margin-top:1rem;">
    <section class="category-section" style="max-width:480px; margin: auto;">
      <div id="loggedOutView">
        <div class="auth-tabs">
          <div class="auth-tab active" id="loginTab">Login</div>
          <div class="auth-tab" id="registerTab">Register</div>
        </div>

        <div id="loginPanel" class="auth-panel active">
          <div class="form-row"><label>Email <input id="loginEmail" type="email" required /></label></div>
          <div class="form-row"><label>Password <input id="loginPassword" type="password" required /></label></div>
          <button id="loginBtn" class="btn">Login</button>
        </div>

        <div id="registerPanel" class="auth-panel">
          <div class="form-row"><label>Full Name <input id="registerName" required /></label></div>
          <div class="form-row"><label>Email <input id="registerEmail" type="email" required /></label></div>
          <div class="form-row"><label>Phone <input id="registerPhone" /></label></div>
          <div class="form-row"><label>Password <input id="registerPassword" type="password" required /></label></div>
          <button id="registerBtn" class="btn">Create Account</button>
        </div>

        <div id="authMessage" class="admin-message"></div>
      </div>

      <div id="loggedInView" style="display:none;">
        <h3>Welcome back!</h3>
        <p id="accountInfo"></p>
        <div style="display:flex; gap:0.6rem;">
          <a class="btn btn-outline" href="orders.html">My Orders</a>
          <button id="logoutBtn" class="btn">Logout</button>
        </div>
      </div>
    </section>
  </main>
  <div id="siteFooter"></div>
  <script src="common.js"></script>
  <script src="account.js"></script>
</body>
</html>
